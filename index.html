<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cube City</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="src/style.css">
</head>
<body>
    <div id="info">
        Cube City - Explore the virtual world<br />
        MOUSE to look around and to throw balls<br/>
        WASD to move, SPACE to jump, F to toggle gravity
    </div>
    <div id="container"></div>
    
    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div id="loading-progress">
            <div class="spinner"></div>
            <div id="loading-text">Loading Cube City...</div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text">0/0 loaded</div>
        </div>
    </div>
    
    <!-- Redirect dialog -->
    <div id="redirect-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-content">
            <p>Open this website in a new tab?</p>
            <div class="dialog-buttons">
                <button id="cancel-redirect">Cancel</button>
                <button id="confirm-redirect">Go</button>
            </div>
        </div>
    </div>
    
    <!-- Load Three.js as a regular script -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.min.js"></script>
    
    <!-- Load Three.js examples as modules -->
    <script type="module">
        // Import the Three.js examples as modules
        import Stats from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/libs/stats.module.js';
        import { Octree } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/math/Octree.js';
        import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/loaders/RGBELoader.js';
        import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/postprocessing/RenderPass.js';
        import { OutlinePass } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/postprocessing/OutlinePass.js';
        import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/shaders/FXAAShader.js';
        import { Capsule } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/math/Capsule.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/loaders/GLTFLoader.js';
        
        // Make them globally available so your main.js can access them
        window.Stats = Stats;
        window.Octree = Octree;
        window.RGBELoader = RGBELoader;
        window.EffectComposer = EffectComposer;
        window.RenderPass = RenderPass;
        window.OutlinePass = OutlinePass;
        window.ShaderPass = ShaderPass;
        window.FXAAShader = FXAAShader;
        window.Capsule = Capsule;
        window.GLTFLoader = GLTFLoader;
    </script>
    
    <script type="module" src="./assets/index-7iU4_QKe.js"></script>
</body>
</html>
