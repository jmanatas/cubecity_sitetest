<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js - misc - octree collisions</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="./src/style.css">
        <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="info">
        Octree threejs demo - basic collisions with static triangle mesh<br />
        MOUSE to look around and to throw balls<br/>
        WASD to move and SPACE to jump
    </div>
    <div id="container"></div>
    
    <!-- Loading overlay (should be separate from redirect dialog) -->
    <div id="loading-overlay">
        <div id="loading-progress">
            <div class="spinner"></div>
            <div id="loading-text">Loading textures...</div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text">0/??? loaded</div>
        </div>
    </div>
    
    <!-- Redirect dialog (separate element) -->
    <div id="redirect-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-content">
            <p>Open this website in a new tab?</p>
            <div class="dialog-buttons">
                <button id="cancel-redirect">Cancel</button>
                <button id="confirm-redirect">Go</button>
            </div>
        </div>
    </div>

    <!-- Add Controls button -->
    <button id="toggle-controls-button">Controls</button>

    <!-- Create header section -->
    <div id="object-list-header">
        <!-- Create title -->
        <h3>Scene Objects</h3>
        
        <!-- Create search box -->
        <div id="object-search-container">
            <input type="text" id="object-search" placeholder="Search websites...">
        </div>
        
    </div>
    
    <script type="module" src="./src/main.js"></script>

    <div id="action-buttons-container">
        <div id="mobile-controls">
            <div id="run-toggle-button" class="action-button run-toggle">RUN</div>
            <div id="movement-joystick">
                <div id="movement-stick"></div>
            </div>
        </div>
        
        <div id="vertical-buttons">
            <div id="fly-up-button" class="action-button">▲</div>
            <div id="fly-down-button" class="action-button">▼</div>
        </div>
        
        <!-- Right side: Action buttons and camera joystick -->
        <div id="right-side-controls">
            <!-- Gravity button (moved here from JavaScript) -->
            <div id="gravity-indicator" class="action-button">GRAVITY ON</div>
            
            <!-- Action buttons side by side -->
            <div id="horizontal-buttons">
                <div id="jump-button" class="action-button">↑</div>
                <div id="throw-button" class="action-button">○</div>
            </div>
            
            <!-- Camera control joystick -->
            <div id="camera-joystick-container">
                <div id="camera-joystick">
                    <div id="camera-stick"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
