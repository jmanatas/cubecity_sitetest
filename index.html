    <script>
        // Define classes and functions that were missing
        class Capsule {
            constructor(start, end, radius) {
                this.start = start || new THREE.Vector3(0, 0, 0);
                this.end = end || new THREE.Vector3(0, 1, 0);
                this.radius = radius || 0.5;
            }
            
            translate(offset) {
                this.start.add(offset);
                this.end.add(offset);
            }
        }

        class Octree {
            constructor() {
                this.triangles = [];
            }
            
            fromGraphNode(group) {
                // Simplified implementation
                this.triangles = [];
                group.traverse((child) => {
                    if (child.isMesh) {
                        const geometry = child.geometry;
                        if (geometry) {
                            // Extract triangles from geometry
                            const positionAttribute = geometry.getAttribute('position');
                            if (positionAttribute) {
                                for (let i = 0; i < positionAttribute.count; i += 3) {
                                    if (i + 2 < positionAttribute.count) {
                                        this.triangles.push({
                                            a: new THREE.Vector3().fromBufferAttribute(positionAttribute, i),
                                            b: new THREE.Vector3().fromBufferAttribute(positionAttribute, i + 1),
                                            c: new THREE.Vector3().fromBufferAttribute(positionAttribute, i + 2)
                                        });
                                    }
                                }
                            }
                        }
                    }
                });
            }
            
            capsuleIntersect(capsule) {
                // Simplified collision detection
                for (const triangle of this.triangles) {
                    // Basic sphere-triangle intersection
                    const sphereCenter = new THREE.Vector3().addVectors(capsule.start, capsule.end).multiplyScalar(0.5);
                    const sphereRadius = capsule.radius;
                    
                    // Check if sphere intersects with triangle
                    const triangleNormal = new THREE.Vector3()
                        .crossVectors(
                            new THREE.Vector3().subVectors(triangle.b, triangle.a),
                            new THREE.Vector3().subVectors(triangle.c, triangle.a)
                        )
                        .normalize();
                    
                    const distance = Math.abs(
                        triangleNormal.dot(new THREE.Vector3().subVectors(sphereCenter, triangle.a))
                    );
                    
                    if (distance < sphereRadius) {
                        return {
                            normal: triangleNormal,
                            depth: sphereRadius - distance
                        };
                    }
                }
                return null;
            }
            
            sphereIntersect(sphere) {
                // Simplified sphere intersection
                for (const triangle of this.triangles) {
                    const triangleNormal = new THREE.Vector3()
                        .crossVectors(
                            new THREE.Vector3().subVectors(triangle.b, triangle.a),
                            new THREE.Vector3().subVectors(triangle.c, triangle.a)
                        )
                        .normalize();
                    
                    const distance = Math.abs(
                        triangleNormal.dot(new THREE.Vector3().subVectors(sphere.center, triangle.a))
                    );
                    
                    if (distance < sphere.radius) {
                        return {
                            normal: triangleNormal,
                            depth: sphere.radius - distance
                        };
                    }
                }
                return null;
            }
        }

        class OctreeHelper extends THREE.LineSegments {
            constructor(octree) {
                const geometry = new THREE.BufferGeometry();
                const material = new THREE.LineBasicMaterial({ color: 0x00ff00, wireframe: true });
                super(geometry, material);
                this.octree = octree;
            }
        }

        class OutlinePass {
            constructor(resolution, scene, camera) {
                this.selectedObjects = [];
                this.visibleEdgeColor = new THREE.Color();
                this.hiddenEdgeColor = new THREE.Color();
                this.edgeStrength = 1.0;
                this.edgeGlow = 0.0;
                this.edgeThickness = 1.0;
                this.pulsePeriod = 0.0;
            }
            
            setSize(width, height) {
                // Empty implementation
            }
        }

        // AvatarController class
        class AvatarController {
            constructor(character = null, avatar = null) {
                this.character = character;
                this.avatar = avatar;
                this.controls = {
                    key: [0, 0],
                    velocity: new THREE.Vector3(),
                    walkVelocity: 1.5,
                    runVelocity: 5.5,
                };
            }
            
            update(delta, keyStates, cameraAzimuth) {
                // Reset controls state
                this.controls.key[0] = 0;
                this.controls.key[1] = 0;
                this.controls.key[2] = 0;

                // Update key states
                if (keyStates['KeyW']) this.controls.key[0] = -1;
                if (keyStates['KeyS']) this.controls.key[0] = 1;
                if (keyStates['KeyA']) this.controls.key[1] = -1;
                if (keyStates['KeyD']) this.controls.key[1] = 1;
                if (keyStates['ShiftLeft']) this.controls.key[2] = 1;

                // Calculate movement
                const active = this.controls.key[0] !== 0 || this.controls.key[1] !== 0;
                const velocity = this.controls.key[2] ? this.controls.runVelocity : this.controls.walkVelocity;

                // Calculate moveVector
                const moveVector = new THREE.Vector3(0, 0, 0);
                
                if (active) {
                    const direction = new THREE.Vector3(
                        this.controls.key[1], 0, this.controls.key[0]
                    ).normalize();
                    
                    const rotationMatrix = new THREE.Matrix4().makeRotationY(cameraAzimuth);
                    direction.applyMatrix4(rotationMatrix);
                    
                    moveVector.copy(direction).multiplyScalar(velocity);
                    
                    // Update character rotation
                    const angle = Math.atan2(moveVector.x, moveVector.z);
                    if (this.character) {
                        this.character.rotation.y = angle;
                    }
                }

                // Determine animation
                let animation = 'idle';
                
                if (!this.avatar.gravityEnabled) {
                    animation = 'fly'; // Fly when gravity is off
                } else if (this.avatar && this.avatar.isJumping) {
                    animation = 'jump'; // Jump animation when actively jumping
                } else if (!this.avatar.onFloor) {
                    animation = 'jump'; // Jump animation when falling (not on floor)
                } else if (moveVector.length() > 0.1) {
                    animation = this.controls.key[2] ? 'run' : 'walk';
                }
                return {
                    moveVector: moveVector,
                    animation: animation
                };
            }
        }

        // Avatar class
        class Avatar {
            constructor(scene, respawnHeight, playerHeight, playerRadius) {
                this.scene = scene;
                this.respawnHeight = respawnHeight;
                this.playerHeight = playerHeight || 2.0;
                this.playerRadius = playerRadius || 0.4;
                this.avatarFeetOffset = 0;

                this.isJumping = false;
                this.gravityEnabled = true;
                
                // Player physics
                this.collider = new Capsule(
                    new THREE.Vector3(0, respawnHeight + this.playerRadius, 0),
                    new THREE.Vector3(0, respawnHeight + this.playerHeight * 0.5, 0),
                    this.playerRadius
                );
                
                this.velocity = new THREE.Vector3();
                this.direction = new THREE.Vector3();
                this.onFloor = false;
                
                // Character model
                this.character = null;
                this.mixer = null;
                this.animations = null;
                this.animationActions = {
                    idle: null,
                    walk: null,
                    run: null,
                    jump: null,
                    fly: null
                };
                this.currentAction = null;
                
                // Debug
                this.debugCapsuleMesh = null;
                this.debugEnabled = false;
                
                // Camera
                this.cameraMode = 'thirdPerson';
                this.cameraTarget = new THREE.Vector3();
                this.cameraDistance = 5;
                this.cameraHeight = 2;
                this.cameraAzimuth = 0;
                this.cameraPolar = Math.PI / 3;
                
                this.controller = null;
            }

            // Jump the avatar
            jump() {
                if (!this.onFloor || this.isJumping) {
                    return false;
                }

                this.velocity.y = 15; // Jump impulse
                this.onFloor = false;
                this.isJumping = true;
                
                // Trigger jump animation if available
                if (this.mixer && this.animations.jump) {
                    // Fade to jump animation
                    const action = this.mixer.clipAction(this.animations.jump);
                    action.reset();
                    action.setEffectiveTimeScale(1);
                    action.setEffectiveWeight(1);
                    action.clampWhenFinished = true;
                    action.loop = THREE.LoopOnce;
                    action.fadeIn(0.1);
                    action.play();
                    
                    // Store reference to current action
                    this.currentAction = 'jump';
                }
                
                return true;
            }

            resetState() {
                this.velocity.set(0, 0, 0);
                this.isJumping = false;
                
                // Only set animation if animations are loaded
                if (this.animationActions && this.animationActions.idle) {
                    this.setAnimation('idle');
                }
            }

            async loadCharacter(modelPath) {
                const loader = new THREE.GLTFLoader();
                try {
                    const gltf = await loader.loadAsync(modelPath);
                    this.character = gltf.scene;

                    // Calculate positioning
                    const box = new THREE.Box3().setFromObject(this.character);
                    this.avatarFeetOffset = box.min.y;
                    const avatarHeight = box.max.y - box.min.y;
                    
                    // Set up animations
                    this.mixer = new THREE.AnimationMixer(this.character);
                    this.animations = gltf.animations;
                    
                    if (this.animations && this.animations.length > 0) {
                        this.animationActions.idle = this.mixer.clipAction(this.findAnimation('idle'));
                        this.animationActions.walk = this.mixer.clipAction(this.findAnimation('walk'));
                        this.animationActions.run = this.mixer.clipAction(this.findAnimation('run'));
                        this.animationActions.jump = this.mixer.clipAction(this.findAnimation('jump'));
                        this.animationActions.fly = this.mixer.clipAction(this.findAnimation('fly'));
                        
                        Object.values(this.animationActions).forEach(action => {
                            if (action) action.setLoop(THREE.LoopRepeat, Infinity);
                        });
                        
                        this.setAnimation('idle');
                    }
                    
                    // Position character
                    this.character.position.set(0, this.respawnHeight - this.avatarFeetOffset, 0);
                    this.scene.add(this.character);
                    
                    // Initialize controller
                    this.controller = new AvatarController(this.character, this);
                    
                    return this.character;
                } catch (error) {
                    console.error('Error loading character:', error);
                    return null;
                }
            }

            findAnimation(name) {
                const lowerName = name.toLowerCase();
                return this.animations.find(anim => 
                    anim.name.toLowerCase().includes(lowerName)
                ) || this.animations[0];
            }

            setAnimation(name) {
                if (this.currentAction === name) return;

                if (!this.animationActions[name]) return;
                
                // Fade out current animation
                if (this.currentAction && this.animationActions[this.currentAction]) {
                    this.animationActions[this.currentAction].fadeOut(0.2);
                }
                
                // Fade in new animation
                if (this.animationActions[name]) {
                    const action = this.animationActions[name];
                    
                    // Remove any existing event listeners to prevent memory leaks
                    if (action._onFinish) {
                        action.getMixer().removeEventListener('finished', action._onFinish);
                        action._onFinish = null;
                    }
                    
                    action.reset()
                        .setEffectiveTimeScale(1.0)
                        .fadeIn(0.2)
                        .play();
                    
                    // For jump animation, set up completion callback
                    if (name === 'jump') {
                        // Create a proper callback function
                        const onJumpFinished = (e) => {
                            if (e.action === action) {
                                this.isJumping = false;
                                // Automatically transition back to idle when jump completes
                                if (this.onFloor) {
                                    this.setAnimation('idle');
                                }
                                // Remove the event listener after it fires
                                action.getMixer().removeEventListener('finished', onJumpFinished);
                            }
                        };
                        
                        // Store reference and add event listener
                        action._onFinish = onJumpFinished;
                        action.getMixer().addEventListener('finished', onJumpFinished);
                    }
                    
                    this.currentAction = name;
                }
            }

            update(deltaTime) {
                // Update character position to match capsule
                if (this.character) {
                    this.character.position.x = this.collider.start.x;
                    this.character.position.z = this.collider.start.z;
                    this.character.position.y = this.collider.start.y - this.playerRadius - this.avatarFeetOffset;
                }
                
                // Update debug capsule position if it exists
                if (this.debugCapsuleMesh) {
                    const centerY = (this.collider.start.y + this.collider.end.y) / 2;
                    this.debugCapsuleMesh.position.set(
                        this.collider.start.x,
                        centerY,
                        this.collider.start.z
                    );
                }
            }

            toggleCameraMode() {
                this.cameraMode = this.cameraMode === 'firstPerson' ? 'thirdPerson' : 'firstPerson';
                
                if (this.character) {
                    this.character.visible = (this.cameraMode === 'thirdPerson');
                }
            }

            resetThirdPersonCamera(camera) {
                if (!this.character) return;
                
                this.cameraDistance = 5;
                this.cameraHeight = 1.5;
                this.cameraAzimuth = this.character.rotation.y + Math.PI;
                this.cameraPolar = Math.PI / 3;
                
                const spherical = new THREE.Spherical();
                spherical.radius = this.cameraDistance;
                spherical.phi = this.cameraPolar;
                spherical.theta = this.cameraAzimuth;

                const offset = new THREE.Vector3();
                offset.setFromSpherical(spherical);

                this.cameraTarget.copy(this.character.position);
                this.cameraTarget.y += this.cameraHeight;
                
                camera.position.copy(this.cameraTarget).add(offset);
                camera.lookAt(this.cameraTarget);
            }

            updateThirdPersonCamera(camera) {
                if (this.cameraMode !== 'thirdPerson' || !this.character) return;
                
                const spherical = new THREE.Spherical();
                spherical.radius = this.cameraDistance;
                spherical.phi = this.cameraPolar;
                spherical.theta = this.cameraAzimuth;

                const offset = new THREE.Vector3();
                offset.setFromSpherical(spherical);

                this.cameraTarget.copy(this.character.position);
                this.cameraTarget.y += this.cameraHeight;
                
                camera.position.copy(this.cameraTarget).add(offset);
                camera.lookAt(this.cameraTarget);
            }

            debugCapsule() {
                if (this.debugCapsuleMesh) this.scene.remove(this.debugCapsuleMesh);
                
                const capsuleGeometry = new THREE.CapsuleGeometry(
                    this.playerRadius,
                    this.playerHeight - (2 * this.playerRadius),
                    8, 16
                );
                
                this.debugCapsuleMesh = new THREE.Mesh(
                    capsuleGeometry,
                    new THREE.MeshBasicMaterial({
                        color: 0xff0000,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.7
                    })
                );
                
                // Position at the center of the physics capsule
                const centerY = (this.collider.start.y + this.collider.end.y) / 2;
                
                this.debugCapsuleMesh.position.set(
                    this.collider.start.x,
                    centerY,
                    this.collider.start.z
                );
                
                this.scene.add(this.debugCapsuleMesh);
            }
        }

        // PhysicsWorld class
        const GRAVITY = 30;
        const SPHERE_RADIUS = 0.2;
        const STEPS_PER_FRAME = 5;

        // Reusable vectors for physics calculations
        const vector1 = new THREE.Vector3();
        const vector2 = new THREE.Vector3();
        const vector3 = new THREE.Vector3();

        class PhysicsWorld {
            constructor(scene) {
                this.scene = scene;
                this.worldOctree = new Octree();
                this.spheres = [];
                this.sphereIdx = 0;
            }

            // Initialize physics world with objects
            initWorld(worldObjects, debugEnabled = false) {
                this.worldOctree = new Octree();
                this.worldOctree.fromGraphNode(worldObjects);
                
                // Add debug visualization
                const helper = new OctreeHelper(this.worldOctree);
                helper.visible = debugEnabled;
                this.scene.add(helper);
            }

            // Add spheres for physics simulation
            addSphere(sphere) {
                this.spheres.push(sphere);
            }

            // Player collision detection
            playerCollisions(player) {
                const result = this.worldOctree.capsuleIntersect(player.collider);
                
                if (result && result.depth > 0.0001) {
                    // We have a valid collision
                    const wasOnFloor = player.onFloor;
                    player.onFloor = result.normal.y > 0.5;

                    if (player.onFloor) {
                        // Stronger response for floor collisions
                        const penetrationCorrection = Math.max(result.depth, 0.001);
                        player.collider.translate(result.normal.multiplyScalar(penetrationCorrection));
                        
                        // Cancel vertical velocity completely
                        player.velocity.y = Math.max(player.velocity.y, 0);
                        
                        // Apply stronger friction
                        player.velocity.x *= 0.5;
                        player.velocity.z *= 0.5;
                    } else {
                        // Regular collision response
                        const velocityDotNormal = result.normal.dot(player.velocity);
                        player.velocity.addScaledVector(result.normal, -velocityDotNormal * 1.5);
                        player.collider.translate(result.normal.multiplyScalar(result.depth * 1.05));
                    }
                    
                    // If we were on floor and still are, keep it true
                    if (wasOnFloor && player.onFloor) {
                        player.onFloor = true;
                    }
                } else {
                    // No collision detected - only set onFloor to false if we're moving downward
                    // or if we've been in the air for a while
                    if (player.velocity.y < -0.1) { // Only set false if falling
                        player.onFloor = false;
                    }
                }
            }

            // Sphere-to-sphere collision detection
            spheresCollisions() {
                for (let i = 0, length = this.spheres.length; i < length; i++) {
                    const s1 = this.spheres[i];

                    for (let j = i + 1; j < length; j++) {
                        const s2 = this.spheres[j];

                        const d2 = s1.collider.center.distanceToSquared(s2.collider.center);
                        const r = s1.collider.radius + s2.collider.radius;
                        const r2 = r * r;

                        if (d2 < r2) {
                            const normal = vector1.subVectors(s1.collider.center, s2.collider.center).normalize();
                            const v1 = vector2.copy(normal).multiplyScalar(normal.dot(s1.velocity));
                            const v2 = vector3.copy(normal).multiplyScalar(normal.dot(s2.velocity));

                            s1.velocity.add(v2).sub(v1);
                            s2.velocity.add(v1).sub(v2);

                            const d = (r - Math.sqrt(d2)) / 2;
                            s1.collider.center.addScaledVector(normal, d);
                            s2.collider.center.addScaledVector(normal, -d);
                        }
                    }
                }
            }

            // Player-sphere collision detection
            playerSphereCollision(player, sphere) {
                const center = vector1.addVectors(player.collider.start, player.collider.end).multiplyScalar(0.5);
                const sphere_center = sphere.collider.center;
                const r = player.collider.radius + sphere.collider.radius;
                const r2 = r * r;

                // Check collision with capsule start, end, and center points
                for (const point of [player.collider.start, player.collider.end, center]) {
                    const d2 = point.distanceToSquared(sphere_center);

                    if (d2 < r2) {
                        const normal = vector1.subVectors(point, sphere_center).normalize();
                        const v1 = vector2.copy(normal).multiplyScalar(normal.dot(player.velocity));
                        const v2 = vector3.copy(normal).multiplyScalar(normal.dot(sphere.velocity));

                        player.velocity.add(v2).sub(v1);
                        sphere.velocity.add(v1).sub(v2);

                        const d = (r - Math.sqrt(d2)) / 2;
                        
                        // Move BOTH the sphere AND the player capsule
                        sphere_center.addScaledVector(normal, -d);
                        
                        // Also move the player capsule away from the sphere
                        player.collider.start.addScaledVector(normal, d * 0.5);
                        player.collider.end.addScaledVector(normal, d * 0.5);
                    }
                }
            }

            // Update all physics objects
            update(deltaTime, player) {
                // First handle player collisions with world
                this.playerCollisions(player);
                
                // Then update spheres
                this.spheres.forEach(sphere => {
                    sphere.collider.center.addScaledVector(sphere.velocity, deltaTime);
                    const result = this.worldOctree.sphereIntersect(sphere.collider);

                    if (result) {
                        sphere.velocity.addScaledVector(result.normal, -result.normal.dot(sphere.velocity) * 1.5);
                        sphere.collider.center.add(result.normal.multiplyScalar(result.depth));
                    } else {
                        sphere.velocity.y -= GRAVITY * deltaTime;
                    }

                    const damping = Math.exp(-1.5 * deltaTime) - 1;
                    sphere.velocity.addScaledVector(sphere.velocity, damping);
                    
                    // Handle player-sphere collisions
                    this.playerSphereCollision(player, sphere);
                });

                this.spheresCollisions();

                // Update sphere meshes
                for (const sphere of this.spheres) {
                    sphere.mesh.position.copy(sphere.collider.center);
                }
            }
        }

        // Helper function to create a physics sphere
        function createPhysicsSphere(mesh, radius, position) {
            return {
                mesh: mesh,
                collider: new THREE.Sphere(position || new THREE.Vector3(0, -100, 0), radius || SPHERE_RADIUS),
                velocity: new THREE.Vector3()
            };
        }

        function setupSpheres() {
            if (!physicsWorld) {
                console.error("Physics world not initialized");
                return;
            }

            const sphereMaterial = new THREE.MeshLambertMaterial({ color: 0xdede8d });

            for (let i = 0; i < NUM_SPHERES; i++) {
                const mesh = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(SPHERE_RADIUS, 5),
                    sphereMaterial
                );
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                const sphere = createPhysicsSphere(mesh, SPHERE_RADIUS, new THREE.Vector3(0, -100, 0));
                physicsWorld.addSphere(sphere);
                spheres.push(sphere);
            }
        }

        function throwBall() {
            const sphere = spheres[sphereIdx];
            
            // Create a direction vector from the camera
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            sphere.collider.center.copy(avatar.collider.end)
                .addScaledVector(direction, avatar.collider.radius * 1.5);

            const impulse = 15;
            sphere.velocity.copy(direction).multiplyScalar(impulse);
            sphere.velocity.addScaledVector(avatar.velocity, 2);

            sphereIdx = (sphereIdx + 1) % spheres.length;
        }

        // Sets up the teleport button
        function setupTeleportButton() {
            const teleportBtn = document.getElementById('teleport-button');
            if (!teleportBtn) {
                console.error("Teleport button not found");
                return;
            }
            
            teleportBtn.onclick = function() {
                this.classList.add('clicked');

                if (selectedObjectIndex === -1) {
                    setTimeout(() => {
                        this.classList.remove('clicked');
                    }, 300);
                    return;
                }
                
                const objData = objectsData.objects[selectedObjectIndex];
                if (!objData) {
                    setTimeout(() => {
                        this.classList.remove('clicked');
                    }, 300);
                    return;
                }
                
                if (!objData.position) {
                    setTimeout(() => {
                        this.classList.remove('clicked');
                    }, 300);
                    return;
                }
                
                // Teleport player to object position
                const targetX = objData.position[0] || 0;
                const targetY = (objData.position[1] || 0) + avatar.playerRadius;
                const targetZ = objData.position[2] || 0;
                
                // Update physics capsule
                avatar.collider.start.set(targetX, targetY, targetZ);
                avatar.collider.end.set(targetX, targetY + (avatar.playerHeight - 2 * avatar.playerRadius), targetZ);
                
                // Update character position
                if (avatar.character) {
                    avatar.character.position.set(targetX, targetY - avatar.playerRadius, targetZ);
                }
                
                // Keep falling physics state
                avatar.velocity.x = 0;
                avatar.velocity.z = 0;
                
                // If gravity is enabled, give a small downward push
                if (gravityEnabled) {
                    avatar.velocity.y = -0.5;
                }
                
                // Update camera
                if (avatar.cameraMode === 'thirdPerson') {
                    avatar.resetThirdPersonCamera(camera);
                }
                
                // Visual feedback for successful teleport
                this.classList.remove('clicked');
                this.classList.add('success');
                
                // Revert to normal state after 1 second
                setTimeout(() => {
                    this.classList.remove('success');
                }, 1000);
            };
        }

        // Creates a randomized textured material for scene objects
        function createRandomMaterial(position, uvs, isVertical) {
            // Create a texture from the screenshot if available
            const texture = screenshotTextures.length > 0 
                ? screenshotTextures[Math.floor(Math.random() * screenshotTextures.length)]
                : null;
            // Create a new material
            const material = new THREE.MeshStandardMaterial({
                roughness: 0.7,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            // Apply UV mapping
            if (texture) {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();        
                // Reset any texture transformations
                texture.repeat.set(1, 1);
                texture.offset.set(0, 0);
                texture.center.set(0.5, 0.5);        
                // Remove the rotation here since we're handling it in UV mapping
                texture.rotation = 0;

                material.map = texture;
                material.needsUpdate = true;
            } else {
                material.color.setHSL(Math.random(), 0.7, 0.5);
            }

            return material;
        }

        // Processes jump input
        function processJumpInput() {
            if (keyStates['Space'] && avatar.onFloor && gravityEnabled) {
                avatar.jump();
            }
        }

        // Main animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Check if avatar is defined before using it
            if (!avatar) {
                return;
            }

            const deltaTime = Math.min(0.05, clock.getDelta());
            const physicsDeltaTime = deltaTime / STEPS_PER_FRAME;
            
            if (!document.hidden) {
                processJumpInput();
                
                if (physicsWorld) {
                    for (let i = 0; i < STEPS_PER_FRAME; i++) {
                        controls(physicsDeltaTime);
                        updatePlayer(physicsDeltaTime);
                        physicsWorld.update(physicsDeltaTime, avatar);
                        teleportPlayerIfOob();
                    }
                }

                // Add check for mixer before using it
                if (avatar.mixer) {
                    avatar.mixer.update(deltaTime);
                }

                if (avatar.character) {
                    avatar.updateThirdPersonCamera(camera);
                }

                if (renderer) {
                renderer.render(scene, camera);
                }
            }
        }

        // Processes player input and updates avatar movement/animations
        function controls(deltaTime) {
            if (!avatar || !avatar.controller) {
                return;
            }

            let currentAzimuth;
            if (avatar.cameraMode === 'thirdPerson') {
                currentAzimuth = avatar.cameraAzimuth;
            } else {
                currentAzimuth = camera.rotation.y;
            }

            const { moveVector, animation } = avatar.controller.update(deltaTime, keyStates, currentAzimuth);
            
            // Apply movement
            avatar.velocity.x = moveVector.x;
            avatar.velocity.z = moveVector.z;
            
            // Handle Q and E for vertical movement (only when gravity is DISABLED)
            if (!gravityEnabled) {
                const verticalSpeed = 5.0;
                
                if (keyStates['KeyQ']) {
                    // Q key - move up
                    avatar.velocity.y = verticalSpeed;
                } else if (keyStates['KeyE']) {
                    // E key - move down
                    avatar.velocity.y = -verticalSpeed;
                } else {
                    // If neither Q nor E is pressed, maintain current vertical velocity
                }
            }
            
            // Set animation based on controller output, but don't override jump animation
            if (!avatar.isJumping || avatar.currentAction !== 'jump') {
                avatar.setAnimation(animation);
            }
        }

        function updatePlayer(deltaTime) {
            // Store the capsule position BEFORE moving it
            const oldCapsulePosition = new THREE.Vector3().copy(avatar.collider.start);
            
            // Apply gravity if not on floor AND gravity is enabled
            if (!avatar.onFloor && gravityEnabled) {
                avatar.velocity.y -= GRAVITY * deltaTime;
            }
            
            // Store previous floor state
            const wasOnFloor = avatar.onFloor;
            
            // Move the player
            const deltaPosition = avatar.velocity.clone().multiplyScalar(deltaTime);
            avatar.collider.translate(deltaPosition);
            
            // Handle collisions - this will set onFloor appropriately
            physicsWorld.playerCollisions(avatar);
            
            // If we've landed after a jump (was in air, now on floor)
            if (avatar.isJumping && !wasOnFloor && avatar.onFloor) {
                avatar.isJumping = false;
                
                // Get current movement state to determine which animation to transition to
                const { animation } = avatar.controller.update(deltaTime, keyStates, avatar.cameraAzimuth);
                avatar.setAnimation(animation);
            }
            
            // Calculate the actual movement that occurred (after collisions)
            const actualMovement = new THREE.Vector3().subVectors(avatar.collider.start, oldCapsulePosition);
            
            // Update character model position to match the capsule
            if (avatar.character) {
                // Position character so feet are at floor level
                avatar.character.position.copy(avatar.collider.start);
                avatar.character.position.y -= avatar.playerRadius;
            }

            avatar.update(deltaTime);
        }

        function teleportPlayerIfOob() {
            const currentTime = clock.getElapsedTime();
            
            // Use the avatar's current respawn height
            const threshold = avatar.respawnHeight - FALL_THRESHOLD;
            
            // Use only third-person check
            if (avatar.collider.start.y <= threshold) {
                if (!isFalling) {
                    isFalling = true;
                    fallStartTime = currentTime;
                }
                
                if (currentTime - fallStartTime >= RESPAWN_DELAY) {
                    resetPlayerPosition();
                    isFalling = false;
                }
            } else {
                isFalling = false;
            }
        }

        function resetPlayerPosition() {
            // Use the actual collider dimensions
            const capsuleHeight = avatar.collider.end.y - avatar.collider.start.y;
            
            // Reset position to respawn height
            avatar.collider.start.set(0, avatar.respawnHeight + avatar.collider.radius, 0);
            avatar.collider.end.set(0, avatar.respawnHeight + capsuleHeight + avatar.collider.radius, 0);
            
            // Position character to match capsule
            if (avatar.character) {
                avatar.character.position.copy(avatar.collider.start);
                avatar.character.position.y -= avatar.collider.radius;
            }
            
            // Keep falling physics state
            avatar.velocity.x = 0;
            avatar.velocity.z = 0;
            
            // If gravity is enabled, give a small downward push
            if (gravityEnabled) {
                avatar.velocity.y = -0.5;
                avatar.onFloor = false;
            }
            
            // Set appropriate animation
            if (gravityEnabled) {
                avatar.setAnimation('idle');
            } else {
                avatar.setAnimation('fly');
            }
        }

        // Handles window resize events
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Update post-processing
            effectFXAA.uniforms['resolution'].value.set(1 / window.innerWidth, 1 / window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // Sets up the click handler for objects in the scene
        function setupObjectClickHandler() {
            document.addEventListener('click', (event) => {
                if (!highlightEffectEnabled || !highlightedObject) return;
                
                // Get texture URL more reliably
                let material = highlightedObject.material;
                if (Array.isArray(material)) material = material[0];
                
                if (material.map && textureUrls.has(material.map)) {
                    const url = textureUrls.get(material.map);
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            });
        }

        // Initializes all application event listeners
        function setupEventListeners() {
            const container = document.getElementById('container');

            // Keyboard controls
            document.addEventListener('keydown', function(event) {
                keyStates[event.code] = true;
                
                if (event.code === 'Escape') {
                    document.exitPointerLock();
                    document.body.style.cursor = 'auto';
                }
                if (event.code === 'KeyT') {
                    toggleTeleportWindow();
                    document.body.style.cursor = 'auto';
                    return;
                }
                if (event.code === 'KeyB') {
                    if (avatar.debugCapsuleMesh) {
                        avatar.debugCapsuleMesh.visible = !avatar.debugCapsuleMesh.visible;
                    }
                }
                
                // Add F key for gravity toggle
                if (event.code === 'KeyF') {
                    gravityEnabled = !gravityEnabled;
                    avatar.gravityEnabled = gravityEnabled; 
                    
                    // Update visual indicator
                    if (gravityIndicator) {
                        gravityIndicator.textContent = gravityEnabled ? 'GRAVITY: ON' : 'GRAVITY: OFF';
                        
                        if (gravityEnabled) {
                            avatar.setAnimation('fly');
                            avatar.isJumping = false;
                            gravityIndicator.style.color = 'white';
                            gravityIndicator.style.backgroundColor = 'rgba(0,0,0,0.7)';
                            gravityIndicator.style.border = '2px solid #00ff00';
                        } else {
                            const { animation } = avatar.controller.update(0.016, keyStates, avatar.cameraAzimuth);
                            avatar.setAnimation(animation);
                            gravityIndicator.style.color = '#ff6b6b';
                            gravityIndicator.style.backgroundColor = 'rgba(0,0,0,0.9)';
                            gravityIndicator.style.border = '2px solid #ff6b6b';
                        }
                    }
                    
                    // Reset jumping state when gravity is disabled
                    if (!gravityEnabled && avatar.isJumping) {
                        avatar.isJumping = false;
                        avatar.setAnimation('fly');
                    } else if (!gravityEnabled) {
                        avatar.setAnimation('fly');
                    } else {
                        const { animation } = avatar.controller.update(0.016, keyStates, avatar.cameraAzimuth);
                        avatar.setAnimation(animation);
                    }
                    
                    if (!gravityEnabled) {
                        avatar.velocity.y = 0;
                    } else {
                        avatar.onFloor = false;
                        avatar.velocity.y = -1.0;
                    }
                }
                
                // Check if Alt is pressed
                if (event.code === 'AltLeft') {
                    highlightEffectEnabled = true;
                    document.body.classList.add('highlight-mode');
                    // Force update even without mouse movement
                    const mouse = new THREE.Vector2(
                        (renderer.domElement.width/2) / window.innerWidth * 2 - 1,
                        -(renderer.domElement.height/2) / window.innerHeight * 2 + 1
                    );
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(worldObjects.children, true);
                    if (intersects.length > 0) {
                        applyHighlightEffect(intersects[0].object);
                    }
                }
                
                // Handle Q and E only when gravity is DISABLED
                if (!gravityEnabled && (event.code === 'KeyQ' || event.code === 'KeyE')) {
                    event.preventDefault();
                }

                // Key logger
                console.log('Key down:', event.code, event.key);
            });

            document.addEventListener('keyup', (event) => {
                keyStates[event.code] = false;
                
                if (event.code === 'KeyF') {
                    keyStates['KeyF'] = false;
                }
                
                if (event.code === 'AltLeft') {
                    highlightEffectEnabled = false;
                    resetHighlightEffect();
                    document.body.classList.remove('highlight-mode', 'clickable');
                }
                
                if (event.code === 'Space') {
                    keyStates['Space'] = false;
                }
                
                if (!gravityEnabled && (event.code === 'KeyQ' || event.code === 'KeyE')) {
                    if (avatar) {
                        avatar.velocity.y = 0;
                    }
                }
            });

            // Mouse down event to request pointer lock
            container.addEventListener('mousedown', () => {
                document.body.requestPointerLock();
            });
            
            // Mouse up event to release pointer lock
            document.addEventListener('mouseup', () => {
                if (document.pointerLockElement !== null) throwBall();
            });

            // Handle pointer lock change
            document.addEventListener('pointerlockchange', () => {
                // Check if pointer lock is active
                if (document.pointerLockElement === document.body) {
                    // Pointer lock is active
                    if (highlightEffectEnabled) {
                        document.body.classList.add('highlight-mode');
                        // Check if highlighted object has a texture URL
                        if (highlightedObject && highlightedObject.material.map && textureUrls.has(highlightedObject.material.map)) {
                            document.body.classList.add('clickable');
                        }
                    } else {
                        // Not in highlight mode
                        document.body.style.cursor = 'none';
                    }
                } else {
                    // Pointer lock is inactive
                    document.body.classList.remove('highlight-mode', 'clickable');
                    document.body.style.cursor = 'auto';
                }
            });
            
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && highlightEffectEnabled) {
                    highlightEffectEnabled = false;
                    keyStates['AltLeft'] = false;
                    resetHighlightEffect();
                    document.body.classList.remove('highlight-mode', 'clickable');
                }
            });

            // detect objects under cursor - Raycaster
            document.addEventListener('mousemove', (event) => {
            if (!highlightEffectEnabled) return;
            
            // Check if mouse moved enough
            if (Math.abs(event.clientX - lastMouseX) < MOUSE_DEADZONE && 
                Math.abs(event.clientY - lastMouseY) < MOUSE_DEADZONE) {
                return;
            }

            // Update last mouse position
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;

            // Calculate mouse position in normalized device coordinates
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );

            // Create a raycaster from the camera
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // Improved intersection detection:
            raycaster.params.Points.threshold = 0.1;
            raycaster.params.Line.threshold = 0.1;

            // Check for intersections
            const intersects = raycaster.intersectObjects(worldObjects.children, true);

            // hysteresis to prevent flickering between objects
            if (intersects.length > 0) {
                const now = performance.now();
                const bestIntersect = intersects[0];
                
                // If we have a current highlighted object
                if (highlightedObject) {
                    const currentIndex = intersects.findIndex(i => i.object === highlightedObject);
                    
                    // If current object is still in the list and we're not past hysteresis delay
                    if (currentIndex >= 0 && (now - lastHighlightTime < HIGHLIGHT_HYSTERESIS)) {
                        // Keep the current highlight
                        return;
                    }
                }
                
                // Only change highlight if it's a different object
                if (!highlightedObject || highlightedObject !== bestIntersect.object) {
                    applyHighlightEffect(bestIntersect.object);
                }
                } else if (highlightedObject) {
                    // Only reset if we had something highlighted
                    resetHighlightEffect();
                }
            });

            // Continuous Alt check
            function checkAltKeyState() {
                if (highlightEffectEnabled) {
                    if (!keyStates['AltLeft']) {
                        // Alt was released
                        highlightEffectEnabled = false;
                        resetHighlightEffect();
                        document.body.classList.remove('highlight-mode', 'clickable');
                    } else if (!highlightedObject) {
                        // Alt is held but no object highlighted - recheck
                        const mouse = new THREE.Vector2(
                            (renderer.domElement.width/2) / window.innerWidth * 2 - 1,
                            -(renderer.domElement.height/2) / window.innerHeight * 2 + 1
                        );
                        const raycaster = new THREE.Raycaster();
                        raycaster.setFromCamera(mouse, camera);
                        const intersects = raycaster.intersectObjects(worldObjects.children, true);
                        // Check if we hit anything
                        if (intersects.length > 0) {
                            applyHighlightEffect(intersects[0].object);
                        }
                    }
                }
                requestAnimationFrame(checkAltKeyState);
            }
            checkAltKeyState();
            
            // Add toggle button event listener
            const toggleBtn = document.getElementById('toggle-object-list');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', toggleTeleportWindow);
            }
        }

        // Toggle Teleport windows with mouse click or using 'T' key
        function toggleTeleportWindow() {
            const list = document.getElementById('object-list');
            const toggleBtn = document.getElementById('toggle-object-list');
            
            // Check if list exists
            if (!list || !toggleBtn) return;
            
            // Toggle visibility
            const isHidden = list.style.display === 'none';
            list.style.display = isHidden ? 'block' : 'none';
            
            // Update toggle button state
            if (isHidden) {
                toggleBtn.classList.add('active');
                updateObjectList();
            } else {
                toggleBtn.classList.remove('active');
            }
            
            // Exit Pointer Lock when showing the UI
            if (isHidden && document.pointerLockElement === document.body) {
                document.exitPointerLock();
            }
        }

        // Apply highlight effect to the object
        function applyHighlightEffect(object) {
            if (highlightedObject === object) return;
            
            resetHighlightEffect();
            
            highlightedObject = object;
            
            // Outline effect
            const bbox = new THREE.Box3().setFromObject(object);
            const size = bbox.getSize(new THREE.Vector3()).length();
            outlinePass.edgeStrength = size < 1.0 ? 5.0 : 3.0;
            outlinePass.selectedObjects = [object];
            
            // Restore dimming effect
            worldObjects.traverse((child) => {
                if (!child.isMesh || child === object || !child.material) return;
                
                if (!originalMaterials.has(child)) {
                    originalMaterials.set(child, child.material);
                }
                
                const desatMaterial = child.material.clone();
                desatMaterial.color.setHSL(0, 0, 0.3); // Dimming effect
                child.material = desatMaterial;
            });
            
            // Check if object has a clickable texture
            const hasClickableTexture = object.material.map && textureUrls.has(object.material.map);
            
            // Update cursor classes
            document.body.classList.add('highlight-mode');
            if (hasClickableTexture) {
                document.body.classList.add('clickable');
            } else {
                document.body.classList.remove('clickable');
            }
            
            // Add clickable class if texture has URL
            document.body.classList.toggle('clickable', hasClickableTexture);
            
            // raycaster precision for small objects
            worldObjects.traverse((child) => {
                // Check if child is a mesh
                if (child.isMesh) {
                    // Increase precision for small objects
                    if (child.geometry.boundingSphere) {
                        const radius = child.geometry.boundingSphere.radius;
                        if (radius < 1.0) {
                            child.raycast = function(raycaster, intersects) {
                                const geometry = this.geometry;
                                const matrixWorld = this.matrixWorld;
                                
                                // Use more precise raycasting for small objects
                                const threshold = raycaster.params.Points.threshold;
                                raycaster.params.Points.threshold = 0.5;
                                
                                // Call original raycast
                                THREE.Mesh.prototype.raycast.call(this, raycaster, intersects);
                                
                                // Restore threshold
                                raycaster.params.Points.threshold = threshold;
                            };
                        }
                    }
                }
            });
        }

        // Reset highlight effect
        function resetHighlightEffect() {
            if (!highlightedObject) return;
            
            // Clear cursor classes
            document.body.classList.remove('clickable');
            if (!highlightEffectEnabled) {
                document.body.classList.remove('highlight-mode');
            }
            
            // Remove clickable class
            document.body.classList.remove('clickable');
            
            // Clear outline selection
            outlinePass.selectedObjects = [];

            // Restore original materials
            worldObjects.traverse((child) => {
                if (originalMaterials.has(child)) {
                    child.material = originalMaterials.get(child);
                    originalMaterials.delete(child);
                }
            });
            
            highlightedObject = null;
        }

        // Loads screenshot textures from predefined domains
        async function loadScreenshotTextures() {
            const textureLoader = new THREE.TextureLoader();
            screenshotTextures = [];
            
            // Show loading overlay
            const loadingOverlay = document.getElementById('loading-overlay');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            // Update progress function
            const updateProgress = (loaded, total) => {
                const percent = Math.round((loaded / total) * 100);
                progressBar.style.width = `${percent}%`;
                progressText.textContent = `${loaded}/${total} loaded`;
            };

            // Process all domains
            for (let i = 0; i < screenshotDomains.length; i++) {
                const domain = screenshotDomains[i];
                const url = `https://screenshotof.com/${domain}`;
                const websiteUrl = `https://${domain}`;
                
                try {
                    const texture = await new Promise((resolve) => {
                        textureLoader.load(
                            url,
                            (texture) => {
                                // Check if texture is valid
                                if (!texture.image || texture.image.width === 0) {
                                    const fallback = createColoredFallbackTexture();
                                    const fallbackTexture = new THREE.CanvasTexture(fallback);
                                    textureUrls.set(fallbackTexture, websiteUrl);
                                    resolve(fallbackTexture);
                                    return;
                                }
                                // Texture is valid
                                texture.wrapS = THREE.RepeatWrapping;
                                texture.wrapT = THREE.RepeatWrapping;
                                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                                textureUrls.set(texture, websiteUrl);
                                resolve(texture);
                            },
                            undefined,
                            (error) => {
                                console.error('Error loading texture:', url, error);
                                const fallback = createColoredFallbackTexture();
                                const fallbackTexture = new THREE.CanvasTexture(fallback);
                                textureUrls.set(fallbackTexture, websiteUrl);
                                resolve(fallbackTexture);
                            }
                        );
                    });
                    // Add texture to the list
                    screenshotTextures.push(texture);
                    updateProgress(i + 1, screenshotDomains.length);
                } catch (error) {
                    console.error('Error loading texture:', error);
                    // Still count as loaded (fallback will be used)
                    updateProgress(i + 1, screenshotDomains.length);
                }
            }
            
            // Hide loading overlay when done
            loadingOverlay.style.display = 'none';
        }

        let gravityIndicator;

        // Main initialization function
        async function init() {
        const loadingOverlay = document.getElementById('loading-overlay');
        if (loadingOverlay) {
            loadingOverlay.style.display = 'flex';
        }
        
        try {
            // 1. CREATE SCENE FIRST - This is the critical fix
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0xfffae6, 0, 750);

                // Create basic Three.js components
                scene = new THREE.Scene();
                scene.fog = new THREE.Fog(0xfffae6, 0, 750);

                // Camera setup
                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 500);
                camera.rotation.order = 'YXZ';

                // Initialize physics world
                physicsWorld = new PhysicsWorld(scene);
                
                // Setup player
                setupPlayer();
                
                // Create renderer
                renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    powerPreference: "high-performance",
                    logarithmicDepthBuffer: false
                });
                renderer.shadowMap.enabled = false;
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 0.5;
                document.getElementById('container').appendChild(renderer.domElement);

                // Loader for HDR environment map
                const loader = new THREE.RGBELoader();
                loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/equirectangular/venice_sunset_1k.hdr', (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    scene.background = texture;
                    scene.environment = texture;
                }, undefined, (error) => {
                    console.error('Error loading HDR texture:', error);
                    // Fallback to color background
                    scene.background = new THREE.Color(0x88ccff);
                });

                // Handle window resize
                window.addEventListener('resize', onWindowResize);

                // Outline pass setup
                outlinePass = new OutlinePass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    scene,
                    camera
                );

                // Pink outline configuration
                outlinePass.visibleEdgeColor.set(0xff69b4);
                outlinePass.hiddenEdgeColor.set(0xff1493);
                outlinePass.edgeStrength = 3.0;
                outlinePass.edgeGlow = 0.5;
                outlinePass.edgeThickness = 1.0;
                outlinePass.pulsePeriod = 0;

                // Load assets
                threejsData = await loadJSON();
                objectsData = threejsData;

                // Load screenshot textures before creating objects
                await loadScreenshotTextures();

                // Create the UI elements
                createObjectListWindow();
                setupTeleportButton();

                // Add toggle button
                const toggleBtn = document.createElement('button');
                toggleBtn.id = 'toggle-object-list';
                toggleBtn.textContent = 'Teleport'; 
                toggleBtn.style.pointerEvents = 'auto';
                toggleBtn.style.zIndex = '101';
                document.body.appendChild(toggleBtn);

                // Initialize world
                worldOctree = new Octree();
                worldObjects = new THREE.Group();

                // Create world objects
                threejsData.objects.forEach(objData => {
                    if (!objData.vertices) return;
                        
                    // Create or reuse geometry
                    const geometryKey = objData.vertices.join('|');
                    let geometry = geometryCache[geometryKey];
                    if (!geometry) {
                        geometry = new THREE.BufferGeometry();
                        geometry.setAttribute('position', new THREE.Float32BufferAttribute(objData.vertices, 3));
                        geometryCache[geometryKey] = geometry;
                    }
                    
                    // Set indices if available
                    if (objData.indices?.length > 0) {
                        geometry.setIndex(objData.indices);
                    }

                    // Get geometry data
                    geometry.computeBoundingBox();
                    const boundingBox = geometry.boundingBox;
                    const size = new THREE.Vector3();
                    boundingBox.getSize(size);

                    // Calculate plane normal
                    const positions = geometry.attributes.position.array;
                    const normal = new THREE.Vector3();
                    const vA = new THREE.Vector3().fromArray(positions, 0);
                    const vB = new THREE.Vector3().fromArray(positions, 3);
                    const vC = new THREE.Vector3().fromArray(positions, 6);
                    vB.sub(vA);
                    vC.sub(vA);
                    normal.crossVectors(vB, vC).normalize();

                    // Determine dominant axis
                    const absNormal = new THREE.Vector3(
                        Math.abs(normal.x),
                        Math.abs(normal.y),
                        Math.abs(normal.z)
                    );
                    const maxComponent = Math.max(absNormal.x, absNormal.y, absNormal.z);
                    const isVertical = absNormal.y !== maxComponent;

                    // Generate UVs
                    const uvs = [];
                    for (let i = 0; i < positions.length; i += 3) {
                        // Get UV coordinates based on the dominant axis
                        if (isVertical) {
                            // YZ plane (wall primarily facing X)
                            if (absNormal.x > absNormal.z) {
                                const u = (positions[i+1] - boundingBox.min.y) / size.y;
                                const v = (positions[i+2] - boundingBox.min.z) / size.z;
                                
                                // Check if it's perfectly X-axis aligned
                                if (Math.abs(normal.x) > 0.99) {
                                    // X-axis aligned wall - apply -90° rotation
                                    uvs.push(1 - v, u);
                                } else {
                                    // Not perfectly X-aligned - keep original
                                    uvs.push(u, v);
                                }
                            } else {
                                // XY plane (wall primarily facing Z)
                                const u = (positions[i] - boundingBox.min.x) / size.x;
                                const v = (positions[i+1] - boundingBox.min.y) / size.y;
                                
                                // Z-axis aligned walls keep original orientation
                                uvs.push(u, v);
                            }
                        } else {
                            // Horizontal planes - standard XZ mapping
                            uvs.push(
                                (positions[i] - boundingBox.min.x) / size.x,
                                (positions[i+2] - boundingBox.min.z) / size.z
                            );
                        }
                    }
                    
                    // Set UVs
                    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

                    // Recompute normals
                    geometry.computeVertexNormals();

                    // Get position safely
                    const position = new THREE.Vector3(
                        objData.position?.[0] || 0,
                        objData.position?.[1] || 0,
                        objData.position?.[2] || 0
                    );

                    // Create material with position and UVs
                    const material = createRandomMaterial(position, objData.uvs, isVertical);
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.copy(position);
                    mesh.rotation.set(
                        objData.rotation?.[0] || 0,
                        objData.rotation?.[1] || 0,
                        objData.rotation?.[2] || 0
                    );
                    mesh.scale.set(
                        objData.scale?.[0] || 1,
                        objData.scale?.[1] || 1,
                        objData.scale?.[2] || 1
                    );
                    mesh.castShadow = objData.castShadow !== false;
                    mesh.receiveShadow = objData.receiveShadow !== false;
                    worldObjects.add(mesh);
                });

                // Update physics world with the created objects
                physicsWorld.initWorld(worldObjects);

                // Add world to scene
                scene.add(worldObjects);
                worldOctree.fromGraphNode(worldObjects);

                // Setup lights
                setupLights();

                // Setup spheres
                setupSpheres();
                
                // Create gravity indicator
                gravityIndicator = createGravityIndicator();

                // Try to load character model
                try {
                    await avatar.loadCharacter('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf');
                    console.log('Avatar loaded successfully');
                } catch (error) {
                    console.error('Failed to load avatar model:', error);
                    // Create a simple fallback avatar
                    const geometry = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
                    const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                    avatar.character = new THREE.Mesh(geometry, material);
                    scene.add(avatar.character);
                }
                
                // Set to third-person mode
                avatar.cameraMode = 'thirdPerson';
                avatar.resetThirdPersonCamera(camera);

                // Debug capsule
                avatar.debugCapsule();

                // Setup event listeners
                setupEventListeners();
                setupObjectClickHandler();

                // Start animation
                animate();

            } catch (error) {
                console.error('Initialization failed:', error);
                // Setup a simple fallback scene
                setupFallbackScene();
                // Start animation anyway
                animate();
            } finally {
                if (loadingOverlay) {
                    loadingOverlay.style.display = 'none';
                }
            }
        }

        function cleanup() {
            // Check if worldObjects exists and has children before trying to traverse it
            if (!worldObjects || !worldObjects.children) return;
            
            // Dispose geometries, materials
            worldObjects.traverse(child => {
                if (child.isMesh) {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m && m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                }
            });
        }

        // Call on window unload
        window.addEventListener('beforeunload', cleanup);

        // Start the application
        init();
    </script>
