<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Avatar Experience</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        #progress-bar-container {
            width: 300px;
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        #progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }
        #toggle-object-list {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }
        #toggle-object-list.active {
            background: rgba(0, 100, 0, 0.7);
        }
        #object-list {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-height: 500px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border-radius: 10px;
            z-index: 1000;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        #object-list-header {
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        #object-list-content {
            max-height: 400px;
            overflow-y: auto;
        }
        .object-item {
            padding: 10px 15px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }
        .object-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .object-item.selected {
            background: rgba(0, 100, 200, 0.3);
        }
        .object-name {
            font-weight: bold;
        }
        .object-position {
            color: #aaa;
            font-size: 0.9em;
            margin-left: 10px;
        }
        #teleport-button {
            padding: 5px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        #teleport-button:hover {
            background: #45a049;
        }
        #teleport-button.clicked {
            transform: scale(0.95);
        }
        #teleport-button.success {
            background: #2E7D32;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading-overlay">
            <h2>Loading Textures...</h2>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <p id="progress-text">0/0 loaded</p>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
