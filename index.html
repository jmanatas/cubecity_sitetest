<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js - misc - octree collisions</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="src/style.css">
        <!-- ADD IMPORT MAP -->
    <script type="importmap">
    {
      "imports": {
        "three": "./src/three.module.js",
        "three/examples/jsm/math/Capsule.js": "./src/three/examples/jsm/math/Capsule.js",
        "three/examples/jsm/math/Octree.js": "./src/three/examples/jsm/math/Octree.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "./src/three/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/loaders/RGBELoader.js": "./src/three/examples/jsm/loaders/RGBELoader.js",
        "three/examples/jsm/postprocessing/EffectComposer.js": "./src/three/examples/jsm/postprocessing/EffectComposer.js",
        "three/examples/jsm/postprocessing/RenderPass.js": "./src/three/examples/jsm/postprocessing/RenderPass.js",
        "three/examples/jsm/postprocessing/OutlinePass.js": "./src/three/examples/jsm/postprocessing/OutlinePass.js",
        "three/examples/jsm/postprocessing/ShaderPass.js": "./src/three/examples/jsm/postprocessing/ShaderPass.js",
        "three/examples/jsm/shaders/FXAAShader.js": "./src/three/examples/jsm/shaders/FXAAShader.js",
        "three/examples/jsm/helpers/OctreeHelper.js": "./src/three/examples/jsm/helpers/OctreeHelper.js",
        "three/examples/jsm/libs/stats.module.js": "./src/three/examples/jsm/libs/stats.module.js"
      }
    }
    </script>
</head>
<body>
    <div id="info">
        Octree threejs demo - basic collisions with static triangle mesh<br />
        MOUSE to look around and to throw balls<br/>
        WASD to move and SPACE to jump
    </div>
    <div id="container"></div>
    
    <!-- Loading overlay (should be separate from redirect dialog) -->
    <div id="loading-overlay">
        <div id="loading-progress">
            <div class="spinner"></div>
            <div id="loading-text">Loading textures...</div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text">0/??? loaded</div>
        </div>
    </div>
    
    <!-- Redirect dialog (separate element) -->
    <div id="redirect-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-content">
            <p>Open this website in a new tab?</p>
            <div class="dialog-buttons">
                <button id="cancel-redirect">Cancel</button>
                <button id="confirm-redirect">Go</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="./src/main.js"></script>
</body>
</html>
